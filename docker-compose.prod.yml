services:
  db:
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - ${ISCY_SECRETS_DIR:?set ISCY_SECRETS_DIR}:/run/secrets:ro

  app:
    environment:
      RUST_BACKEND_BIND: "0.0.0.0:9000"
      DATABASE_URL: !reset null
      DATABASE_URL_FILE: /run/secrets/database_url
      NVD_API_KEY: !reset null
      NVD_API_KEY_FILE: /run/secrets/nvd_api_key
      ISCY_INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/iscy_initial_admin_password
      ISCY_ALERTMANAGER_TOKEN_FILE: /run/secrets/iscy_alertmanager_token
      ISCY_ALERTMANAGER_HMAC_SECRET_FILE: /run/secrets/iscy_alertmanager_hmac_secret
      ISCY_ALERTMANAGER_HMAC_PREVIOUS_SECRET_FILE: /run/secrets/iscy_alertmanager_hmac_previous_secret
      ISCY_ALERTMANAGER_TENANT_ID: ${ISCY_ALERTMANAGER_TENANT_ID:-}
      ISCY_ALERTMANAGER_USER_ID: ${ISCY_ALERTMANAGER_USER_ID:-}
      ISCY_EVIDENCE_OBJECT_STORAGE_ACCESS_KEY_FILE: /run/secrets/iscy_s3_access_key
      ISCY_EVIDENCE_OBJECT_STORAGE_SECRET_KEY_FILE: /run/secrets/iscy_s3_secret_key
      ISCY_EVIDENCE_OBJECT_STORAGE_SESSION_TOKEN_FILE: /run/secrets/iscy_s3_session_token
      ISCY_SECRET_ROOTS: /run/secrets
      ISCY_EVIDENCE_SECRET_ROOTS: /run/secrets
      ISCY_APP_MODE: "production"
      ISCY_TRUST_PROXY_IDENTITY_HEADERS: "0"
      ISCY_TRUSTED_PROXY_CONFIGURED: "1"
      ISCY_SECURE_COOKIES: ${ISCY_SECURE_COOKIES:-1}
      ISCY_HTTPS_CONFIRMED: ${ISCY_HTTPS_CONFIRMED:-0}
      ISCY_HSTS_ENABLED: ${ISCY_HSTS_ENABLED:-0}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - media_data:/app/media
      - ${ISCY_SECRETS_DIR:-./.runtime/secrets}:/run/secrets:ro

  reverse-proxy:
    image: nginx:1.31-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      NGINX_HOST: ${NGINX_HOST:-localhost}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-50m}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-300}
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/live || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
