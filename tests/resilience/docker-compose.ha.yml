name: iscy-resilience

x-app-environment: &app-environment
  DATABASE_URL: postgresql://iscy_test:iscy_test_password@postgres:5432/iscy_test
  RUST_BACKEND_BIND: 0.0.0.0:9000
  ISCY_APP_MODE: development
  ISCY_TRUST_PROXY_IDENTITY_HEADERS: "0"
  ISCY_AGENT_NOTIFICATION_INTERVAL_SECONDS: "0"
  ISCY_EVIDENCE_ALLOW_LOCAL_TEST_ENDPOINT: "true"
  ISCY_EVIDENCE_OBJECT_STORAGE_ACCESS_KEY: iscy_test_access
  ISCY_EVIDENCE_OBJECT_STORAGE_SECRET_KEY: iscy_test_secret_only_123456789
  ISCY_SHUTDOWN_TIMEOUT_SECONDS: "20"

x-app-service: &app-service
  build:
    context: ../..
    dockerfile: rust/iscy-backend/Dockerfile
  environment: *app-environment
  depends_on:
    init:
      condition: service_completed_successfully
    minio-init:
      condition: service_completed_successfully
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/health/ready || exit 1"]
    interval: 2s
    timeout: 2s
    retries: 30
    start_period: 5s

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: iscy_test
      POSTGRES_USER: iscy_test
      POSTGRES_PASSWORD: iscy_test_password
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iscy_test -d iscy_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: docker.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: iscy_test_access
      MINIO_ROOT_PASSWORD: iscy_test_secret_only_123456789
    command: ["server", "/data"]
    volumes:
      - minio-data:/data

  minio-init:
    image: docker.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set iscy http://minio:9000 iscy_test_access iscy_test_secret_only_123456789;
        do sleep 1; done;
        mc mb --ignore-existing iscy/iscy-ha-evidence

  init:
    build:
      context: ../..
      dockerfile: rust/iscy-backend/Dockerfile
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/usr/local/bin/iscy-backend", "init-demo"]

  app-a:
    <<: *app-service
    ports:
      - "127.0.0.1:19101:9000"

  app-b:
    <<: *app-service
    ports:
      - "127.0.0.1:19102:9000"

  proxy:
    image: nginx:1.31-alpine
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy
    ports:
      - "127.0.0.1:19100:80"
    volumes:
      - ./nginx-ha.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/ready || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres-data:
  minio-data:
