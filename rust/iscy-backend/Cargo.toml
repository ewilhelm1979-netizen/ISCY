[package]
name = "iscy-backend"
version = "0.3.22"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0.103"
axum = "0.8"
base64 = { version = "0.23", default-features = false, features = ["std"] }
calamine = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hmac = "0.12"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rust_decimal = { version = "1", default-features = false, features = ["serde", "std"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls", "rust_decimal", "sqlite"] }
