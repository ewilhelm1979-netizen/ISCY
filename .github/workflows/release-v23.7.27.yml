name: Publish V23.7.27

on:
  push:
    branches: ["main"]
    paths:
      - "docs/releases/v23.7.27.md"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Block release on secret findings
        run: nix develop --command make secrets
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view V23.7.27 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release V23.7.27 already exists."
            exit 0
          fi
          gh release create V23.7.27 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ISCY V23.7.27" \
            --notes-file docs/releases/v23.7.27.md
