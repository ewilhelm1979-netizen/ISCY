name: Security XLSX deterministic fix

on:
  push:
    branches:
      - security/bound-xlsx-import-memory

permissions:
  contents: write

jobs:
  apply-generated-files:
    if: >-
      github.repository == 'ewilhelm1979-netizen/ISCY' &&
      github.actor == 'ewilhelm1979-netizen'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact security branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Generate and verify deterministic files
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/iscy-backend/Cargo.toml
          cargo check --manifest-path rust/iscy-backend/Cargo.toml
          cargo check --locked --manifest-path rust/iscy-backend/Cargo.toml
          cargo fmt --manifest-path rust/iscy-backend/Cargo.toml -- --check

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            'rust/iscy-backend/Cargo.lock'
            'rust/iscy-backend/src/import_preview.rs'
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected generated files: %s\n' "${changed[*]}" >&2
            exit 1
          fi

          read -r added deleted path < <(git diff --numstat -- rust/iscy-backend/Cargo.lock)
          test "$path" = 'rust/iscy-backend/Cargo.lock'
          test "$added" = '2'
          test "$deleted" = '0'
          test -z "$(git diff --unified=0 -- rust/iscy-backend/Cargo.lock | grep '^-[^-]' || true)"
          mapfile -t lock_additions < <(
            git diff --unified=0 -- rust/iscy-backend/Cargo.lock \
              | grep '^+[^+]' | sed 's/^+//' | sort
          )
          expected_lock=(
            ' "quick-xml",'
            ' "zip",'
          )
          if [[ "${lock_additions[*]}" != "${expected_lock[*]}" ]]; then
            printf 'Unexpected Cargo.lock additions: %s\n' "${lock_additions[*]}" >&2
            exit 1
          fi

          git diff --check
      - name: Commit exact generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- rust/iscy-backend/Cargo.lock rust/iscy-backend/src/import_preview.rs
          git diff --cached --name-only
          git commit -m 'build: apply deterministic XLSX lock and formatting'
          git push origin HEAD:refs/heads/security/bound-xlsx-import-memory
