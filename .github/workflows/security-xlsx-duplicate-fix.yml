name: Security XLSX duplicate-entry fix

on:
  push:
    branches:
      - security/bound-xlsx-import-memory

permissions:
  contents: write

jobs:
  apply-source-fix:
    if: >-
      github.repository == 'ewilhelm1979-netizen/ISCY' &&
      github.actor == 'ewilhelm1979-netizen'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact security branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Apply exact duplicate-entry hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('rust/iscy-backend/src/import_preview.rs')
          text = path.read_text()
          old = '''    let mut total_uncompressed = 0_u64;
              let mut shared_strings_index = None;
              for index in 0..archive.len() {
                  let file = archive
                      .by_index(index)
                      .map_err(|_| "XLSX-Archiv konnte nicht sicher gelesen werden.".to_string())?;
                  if !file.is_file() {
                      continue;
                  }
                  if file.size() > XLSX_MAX_ENTRY_UNCOMPRESSED_BYTES {
                      return Err("XLSX-Datei ueberschreitet das sichere Entpack-Limit.".to_string());
                  }
                  total_uncompressed = total_uncompressed
                      .checked_add(file.size())
                      .ok_or_else(|| "XLSX-Datei ueberschreitet das sichere Entpack-Limit.".to_string())?;
                  if total_uncompressed > XLSX_MAX_TOTAL_UNCOMPRESSED_BYTES {
                      return Err("XLSX-Datei ueberschreitet das sichere Entpack-Limit.".to_string());
                  }
                  let normalized_name = file.name().replace('\\\\', "/").to_ascii_lowercase();
                  if normalized_name == "sharedstrings.xml" || normalized_name.ends_with("/sharedstrings.xml")
                  {
                      shared_strings_index = Some(index);
                  }
              }

              if let Some(index) = shared_strings_index {
                  let file = archive
                      .by_index(index)
                      .map_err(|_| "XLSX-Shared-Strings konnten nicht sicher gelesen werden.".to_string())?;
                  validate_shared_strings_xml(file, XLSX_MAX_SHARED_STRINGS, XLSX_MAX_USED_CELLS)?;
              }
          '''
          new = '''    let mut total_uncompressed = 0_u64;
              let mut shared_string_indices = Vec::new();
              for index in 0..archive.len() {
                  let file = archive
                      .by_index(index)
                      .map_err(|_| "XLSX-Archiv konnte nicht sicher gelesen werden.".to_string())?;
                  if !file.is_file() {
                      continue;
                  }
                  if file.size() > XLSX_MAX_ENTRY_UNCOMPRESSED_BYTES {
                      return Err("XLSX-Datei ueberschreitet das sichere Entpack-Limit.".to_string());
                  }
                  total_uncompressed = total_uncompressed
                      .checked_add(file.size())
                      .ok_or_else(|| "XLSX-Datei ueberschreitet das sichere Entpack-Limit.".to_string())?;
                  if total_uncompressed > XLSX_MAX_TOTAL_UNCOMPRESSED_BYTES {
                      return Err("XLSX-Datei ueberschreitet das sichere Entpack-Limit.".to_string());
                  }
                  let normalized_name = file.name().replace('\\\\', "/").to_ascii_lowercase();
                  if normalized_name == "sharedstrings.xml" || normalized_name.ends_with("/sharedstrings.xml")
                  {
                      shared_string_indices.push(index);
                  }
              }

              for index in shared_string_indices {
                  let file = archive
                      .by_index(index)
                      .map_err(|_| "XLSX-Shared-Strings konnten nicht sicher gelesen werden.".to_string())?;
                  validate_shared_strings_xml(file, XLSX_MAX_SHARED_STRINGS, XLSX_MAX_USED_CELLS)?;
              }
          '''
          if text.count(old) != 1:
              raise SystemExit('expected archive preflight block not found exactly once')
          text = text.replace(old, new)

          old_test = '''    #[test]
              fn ordinary_shared_strings_remain_supported() {
                  let xml = br#"<?xml version="1.0" encoding="UTF-8"?><sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="2" uniqueCount="2"><si><t>Name</t></si><si><t>Beschreibung</t></si></sst>"#;
                  validate_shared_strings_xml(Cursor::new(xml), 2, 2).unwrap();
              }
          '''
          new_test = '''    #[test]
              fn xlsx_archive_preflight_checks_every_shared_strings_candidate() {
                  use std::io::Write;

                  let mut archive_bytes = Cursor::new(Vec::new());
                  {
                      let mut writer = zip::ZipWriter::new(&mut archive_bytes);
                      let options = zip::write::SimpleFileOptions::default()
                          .compression_method(zip::CompressionMethod::Deflated);
                      writer.start_file("xl/sharedStrings.xml", options).unwrap();
                      write!(
                          writer,
                          r#"<?xml version="1.0" encoding="UTF-8"?><sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="1" uniqueCount="{}"><si><t>attack</t></si></sst>"#,
                          XLSX_MAX_SHARED_STRINGS + 1
                      )
                      .unwrap();
                      writer.start_file("decoy/sharedStrings.xml", options).unwrap();
                      writer.write_all(br#"<?xml version="1.0" encoding="UTF-8"?><sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="1" uniqueCount="1"><si><t>benign</t></si></sst>"#).unwrap();
                      writer.finish().unwrap();
                  }

                  let error = validate_xlsx_archive(archive_bytes.get_ref()).unwrap_err();
                  assert!(error.contains("sichere Import-Limit"));
              }

              #[test]
              fn ordinary_shared_strings_remain_supported() {
                  let xml = br#"<?xml version="1.0" encoding="UTF-8"?><sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="2" uniqueCount="2"><si><t>Name</t></si><si><t>Beschreibung</t></si></sst>"#;
                  validate_shared_strings_xml(Cursor::new(xml), 2, 2).unwrap();
              }
          '''
          if text.count(old_test) != 1:
              raise SystemExit('expected ordinary shared strings test not found exactly once')
          path.write_text(text.replace(old_test, new_test))
          PY

          cargo fmt --manifest-path rust/iscy-backend/Cargo.toml
          cargo check --locked --manifest-path rust/iscy-backend/Cargo.toml
          cargo test --locked --manifest-path rust/iscy-backend/Cargo.toml --lib import_preview::tests
          cargo fmt --manifest-path rust/iscy-backend/Cargo.toml -- --check
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" = '1'
          test "${changed[0]}" = 'rust/iscy-backend/src/import_preview.rs'
      - name: Commit exact source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- rust/iscy-backend/src/import_preview.rs
          git commit -m 'fix(security): validate all XLSX shared-string entries'
          git push origin HEAD:refs/heads/security/bound-xlsx-import-memory
