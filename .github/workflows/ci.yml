name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Run redacted secret scan
        run: nix develop --command make secrets

  rust-backend-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-30
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path rust/iscy-backend/Cargo.toml -- --check
      - name: Run Rust clippy
        run: |
          cargo clippy --locked --manifest-path rust/iscy-backend/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust backend tests
        run: |
          cargo test --locked --manifest-path rust/iscy-backend/Cargo.toml
      - name: Install verified Rust supply-chain tools
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: cargo-audit,cargo-deny
          fallback: none
      - name: Verify advisory-ignored optional dependencies are unreachable
        run: |
          set -euo pipefail
          active_dependency_tree="$(cargo tree --locked --manifest-path rust/iscy-backend/Cargo.toml --edges normal,build,dev --prefix none)"
          if grep -Eq '^(rkyv|rsa) v' <<<"$active_dependency_tree"; then
            echo "::error::An advisory-ignored optional dependency is active; remove the exception or upgrade the dependency."
            grep -E '^(rkyv|rsa) v' <<<"$active_dependency_tree"
            exit 1
          fi
      - name: Audit Rust dependency advisories
        run: |
          cargo audit --file rust/iscy-backend/Cargo.lock \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0235
      - name: Check Rust dependency licenses and sources
        run: |
          cargo deny --manifest-path rust/iscy-backend/Cargo.toml check advisories licenses sources

  rust-msrv-1-88:
    name: rust-msrv-1.88
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-30
        with:
          toolchain: 1.88.0
      - name: Check Rust 1.88 MSRV compatibility
        run: |
          cargo check --locked --manifest-path rust/iscy-backend/Cargo.toml --all-targets
          cargo test --locked --manifest-path rust/iscy-backend/Cargo.toml --no-run

  rust-bootstrap-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-30
        with:
          toolchain: 1.97.0
      - name: Run Rust DB/bootstrap HTTP smoke
        run: |
          make rust-smoke
          make graceful-shutdown-smoke

  nix-rust-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Run Nix Rust app smoke
        run: |
          tmpdir="$(mktemp -d)"
          db_path="$tmpdir/iscy-nix-smoke.sqlite3"
          cookie_file="$tmpdir/iscy-nix-smoke.cookies"
          evidence_file="$tmpdir/evidence.txt"
          import_file="$tmpdir/import-preview.csv"
          export DATABASE_URL="sqlite:////${db_path#/}"
          export ISCY_MEDIA_ROOT="$tmpdir/media"
          export RUST_BACKEND_BIND="127.0.0.1:19001"
          export RUST_BACKEND_URL="http://127.0.0.1:19001"
          printf 'rust smoke evidence\n' > "$evidence_file"
          printf 'Name,Beschreibung,BusinessUnit,Status\nRust Smoke Process,Previewed import,Security Operations,PARTIAL\n' > "$import_file"

          nix run .#iscy-backend -- init-demo
          nix run .#iscy-backend >"$tmpdir/iscy-backend.log" 2>&1 &
          pid="$!"
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 60); do
            if curl -fsS "$RUST_BACKEND_URL/health/live" >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$pid" >/dev/null 2>&1; then
              cat "$tmpdir/iscy-backend.log"
              exit 1
            fi
            sleep 1
          done

          curl -fsS "$RUST_BACKEND_URL/health/live" >/dev/null
          curl -fsS "$RUST_BACKEND_URL/status/" >/dev/null
          curl -fsS -c "$cookie_file" -H "content-type: application/json" -d '{"tenant_id":1,"username":"admin","password":"Admin123!"}' "$RUST_BACKEND_URL/api/v1/auth/sessions" >/dev/null
          curl -fsS -b "$cookie_file" "$RUST_BACKEND_URL/api/v1/auth/session" >/dev/null
          curl -fsS -b "$cookie_file" "$RUST_BACKEND_URL/dashboard/" >/dev/null
          curl -fsS -b "$cookie_file" "$RUST_BACKEND_URL/admin/users/" >/dev/null
          curl -fsS -b "$cookie_file" "$RUST_BACKEND_URL/imports/" >/dev/null
          curl -fsS -b "$cookie_file" "$RUST_BACKEND_URL/incidents/" >/dev/null
          curl -fsS -b "$cookie_file" "$RUST_BACKEND_URL/incidents/1" >/dev/null
          curl -fsS -b "$cookie_file" "$RUST_BACKEND_URL/incidents/1/nis2-export" >/dev/null
          curl -fsS -b "$cookie_file" "$RUST_BACKEND_URL/incidents/1/nis2-export.html" >/dev/null
          curl -fsS -b "$cookie_file" "$RUST_BACKEND_URL/incidents/1/nis2-export.pdf" >/dev/null
          curl -fsS -b "$cookie_file" "$RUST_BACKEND_URL/api/v1/accounts/users" >/dev/null
          curl -fsS -b "$cookie_file" "$RUST_BACKEND_URL/api/v1/accounts/roles" >/dev/null
          curl -fsS -b "$cookie_file" "$RUST_BACKEND_URL/api/v1/accounts/groups" >/dev/null
          curl -fsS -b "$cookie_file" "$RUST_BACKEND_URL/api/v1/accounts/permissions" >/dev/null
          curl -fsS -b "$cookie_file" -F import_type='processes' -F "file=@$import_file;filename=preview.csv;type=text/csv" "$RUST_BACKEND_URL/api/v1/import-center/preview" >/dev/null
          curl -fsS -b "$cookie_file" -H "content-type: application/json" -d '{"import_type":"business_units","replace_existing":false,"csv_data":"name\nRust Smoke Import"}' "$RUST_BACKEND_URL/api/v1/import-center/csv" >/dev/null
          curl -fsS -b "$cookie_file" -F title='Rust Smoke Evidence' -F status='SUBMITTED' -F session_id='1' -F requirement_id='1' -F incident_id='1' -F "file=@$evidence_file;filename=evidence.txt;type=text/plain" "$RUST_BACKEND_URL/api/v1/evidence/uploads" >/dev/null
          curl -fsS -H "x-iscy-tenant-id: 1" -H "x-iscy-user-id: 1" "$RUST_BACKEND_URL/api/v1/catalog/domains" >/dev/null
          curl -fsS -H "x-iscy-tenant-id: 1" -H "x-iscy-user-id: 1" "$RUST_BACKEND_URL/api/v1/requirements" >/dev/null
          curl -fsS -H "x-iscy-tenant-id: 1" -H "x-iscy-user-id: 1" "$RUST_BACKEND_URL/api/v1/incidents" >/dev/null
          curl -fsS -H "x-iscy-tenant-id: 1" -H "x-iscy-user-id: 1" "$RUST_BACKEND_URL/api/v1/incidents/1/nis2-export" >/dev/null
          curl -fsS -H "x-iscy-tenant-id: 1" -H "x-iscy-user-id: 1" "$RUST_BACKEND_URL/api/v1/incidents/1/nis2-export.html" >/dev/null
          curl -fsS -H "x-iscy-tenant-id: 1" -H "x-iscy-user-id: 1" "$RUST_BACKEND_URL/api/v1/incidents/1/nis2-export.pdf" >/dev/null
          curl -fsS -H "x-iscy-tenant-id: 1" -H "x-iscy-user-id: 1" "$RUST_BACKEND_URL/api/v1/product-security/overview" >/dev/null

  object-storage-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-30
        with:
          toolchain: 1.97.0
      - name: Run isolated S3-compatible runtime lifecycle
        run: |
          make object-storage-integration

  performance-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create private performance artifact roots
        id: performance_artifacts
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          workspace="$(mktemp -d "$RUNNER_TEMP/iscy-performance-artifacts.XXXXXX")"
          install -d -m 0700 "$workspace/raw"
          {
            printf 'workspace=%s\n' "$workspace"
            printf 'raw=%s\n' "$workspace/raw"
            printf 'staging=%s\n' "$workspace/staging"
          } >>"$GITHUB_OUTPUT"
      - name: Run bounded PostgreSQL and MinIO performance smoke
        id: performance_test
        env:
          ISCY_PERFORMANCE_RAW_ROOT: ${{ steps.performance_artifacts.outputs.raw }}
        run: |
          make performance-smoke
      - name: Sanitize performance artifact
        id: performance_hygiene
        if: >-
          ${{ always() &&
              (github.event_name == 'push' ||
               (github.event_name == 'pull_request' &&
                github.event.pull_request.head.repo.full_name == github.repository)) }}
        env:
          ARTIFACT_RAW_ROOT: ${{ steps.performance_artifacts.outputs.raw }}
          ARTIFACT_STAGING_ROOT: ${{ steps.performance_artifacts.outputs.staging }}
          ARTIFACT_TEST_STATUS: ${{ steps.performance_test.outcome }}
          ARTIFACT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./scripts/prepare_ci_artifacts.sh \
            --type performance \
            --raw-root "$ARTIFACT_RAW_ROOT" \
            --output-root "$ARTIFACT_STAGING_ROOT" \
            --test-status "$ARTIFACT_TEST_STATUS" \
            --expected-commit "$ARTIFACT_COMMIT_SHA"
          test -f "$ARTIFACT_STAGING_ROOT/artifact-manifest.json"
          printf 'ready=true\n' >>"$GITHUB_OUTPUT"
      - name: Upload performance report
        if: >-
          ${{ always() &&
              (github.event_name == 'push' ||
               (github.event_name == 'pull_request' &&
                github.event.pull_request.head.repo.full_name == github.repository)) &&
              steps.performance_hygiene.outcome == 'success' &&
              steps.performance_hygiene.outputs.ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.performance_artifacts.outputs.staging }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
      - name: Remove performance artifact roots
        if: always()
        env:
          ARTIFACT_WORKSPACE: ${{ steps.performance_artifacts.outputs.workspace }}
        run: |
          set -euo pipefail
          case "$ARTIFACT_WORKSPACE" in
            "$RUNNER_TEMP"/iscy-performance-artifacts.*) ;;
            *) echo 'CI_ARTIFACT_ERROR[cleanup_boundary]' >&2; exit 1 ;;
          esac
          if test -d "$ARTIFACT_WORKSPACE" && ! test -L "$ARTIFACT_WORKSPACE"; then
            rm -rf -- "$ARTIFACT_WORKSPACE"
          fi
          test ! -e "$ARTIFACT_WORKSPACE"

  ha-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run two-instance failover and migration-race test
        run: |
          make ha-integration
      - name: Validate PostgreSQL 18 compatibility and logical upgrade
        run: |
          make postgresql-18-compatibility

  visual-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Create private visual artifact roots
        id: visual_artifacts
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          workspace="$(mktemp -d "$RUNNER_TEMP/iscy-visual-artifacts.XXXXXX")"
          install -d -m 0700 "$workspace/raw"
          {
            printf 'workspace=%s\n' "$workspace"
            printf 'raw=%s\n' "$workspace/raw"
            printf 'staging=%s\n' "$workspace/staging"
          } >>"$GITHUB_OUTPUT"
      - name: Run pinned Playwright visual regression
        id: visual_test
        env:
          ISCY_VISUAL_WORKSPACE_ROOT: ${{ steps.visual_artifacts.outputs.workspace }}
          ISCY_VISUAL_RAW_ROOT: ${{ steps.visual_artifacts.outputs.raw }}
          ISCY_EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          nix develop --command make visual-regression
      - name: Sanitize visual artifact
        id: visual_hygiene
        if: >-
          ${{ always() &&
              (github.event_name == 'push' ||
               (github.event_name == 'pull_request' &&
                github.event.pull_request.head.repo.full_name == github.repository)) }}
        env:
          ARTIFACT_RAW_ROOT: ${{ steps.visual_artifacts.outputs.raw }}
          ARTIFACT_STAGING_ROOT: ${{ steps.visual_artifacts.outputs.staging }}
          ARTIFACT_TEST_STATUS: ${{ steps.visual_test.outcome }}
          ARTIFACT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./scripts/prepare_ci_artifacts.sh \
            --type visual \
            --raw-root "$ARTIFACT_RAW_ROOT" \
            --output-root "$ARTIFACT_STAGING_ROOT" \
            --test-status "$ARTIFACT_TEST_STATUS" \
            --expected-commit "$ARTIFACT_COMMIT_SHA"
          test -f "$ARTIFACT_STAGING_ROOT/artifact-manifest.json"
          printf 'ready=true\n' >>"$GITHUB_OUTPUT"
      - name: Upload visual differences
        if: >-
          ${{ always() &&
              (github.event_name == 'push' ||
               (github.event_name == 'pull_request' &&
                github.event.pull_request.head.repo.full_name == github.repository)) &&
              steps.visual_hygiene.outcome == 'success' &&
              steps.visual_hygiene.outputs.ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.visual_artifacts.outputs.staging }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
      - name: Remove visual artifact roots
        if: always()
        env:
          ARTIFACT_WORKSPACE: ${{ steps.visual_artifacts.outputs.workspace }}
        run: |
          set -euo pipefail
          case "$ARTIFACT_WORKSPACE" in
            "$RUNNER_TEMP"/iscy-visual-artifacts.*) ;;
            *) echo 'CI_ARTIFACT_ERROR[cleanup_boundary]' >&2; exit 1 ;;
          esac
          if test -d "$ARTIFACT_WORKSPACE" && ! test -L "$ARTIFACT_WORKSPACE"; then
            rm -rf -- "$ARTIFACT_WORKSPACE"
          fi
          test ! -e "$ARTIFACT_WORKSPACE"

  docker-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate effective compose configurations
        run: |
          install -d -m 0700 "$RUNNER_TEMP/iscy-compose-secrets"
          export ISCY_SECRETS_DIR="$RUNNER_TEMP/iscy-compose-secrets"
          cp .env.example .env
          docker compose config
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.llm.yml config
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.stage.yml config
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml config
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.llm.yml config
          docker compose -f tests/resilience/docker-compose.ha.yml config
          docker compose --env-file /dev/null -f tests/postgresql/docker-compose.pg18.yml config
          make postgresql-18-contract-tests
      - name: Build hardened application image
        run: |
          docker build --file rust/iscy-backend/Dockerfile .

  release-binary-portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify portable release binary twice
        run: |
          make release-binary-gate

  codex-automation-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          install -m 0755 "$RUNNER_TEMP/actionlint" "$RUNNER_TEMP/actionlint-bin"
          printf '%s\n' "$RUNNER_TEMP" >>"$GITHUB_PATH"
      - name: Run bounded Codex automation checks
        run: |
          command -v shellcheck
          command -v ruby
          make codex-automation-test

  release-candidate-check:
    if: always()
    needs:
      - secret-scan
      - rust-backend-tests
      - rust-msrv-1-88
      - rust-bootstrap-smoke
      - nix-rust-smoke
      - object-storage-integration
      - performance-smoke
      - ha-integration
      - visual-regression
      - docker-config
      - release-binary-portability
    runs-on: ubuntu-24.04
    steps:
      - name: Require all release-candidate jobs
        env:
          REQUIRED_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if printf '%s' "$REQUIRED_RESULTS" | grep -Eq 'failure|cancelled|skipped'; then
            echo "Release-Candidate-Aggregation fehlgeschlagen: mindestens ein Pflichtjob war nicht erfolgreich."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Validate release-candidate metadata
        run: |
          make release-candidate-metadata-check
